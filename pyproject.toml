[project]
name = "drydock"
version = "0.1.0"
description = "Agentic pipeline generation and validation harness: client feed specs in, tested ingestion pipelines out, with a human gate before anything sails."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "langgraph>=0.4",
  "langgraph-checkpoint-sqlite>=2.0",
  "pydantic>=2.7",
  "typer>=0.12",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "mcp>=1.9",
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
bedrock = ["boto3>=1.34"]
anthropic = ["anthropic>=0.40"]

[project.scripts]
drydock = "drydock.cli:app"

[dependency-groups]
dev = [
  "ruff>=0.6",
  "mypy>=1.10",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "types-PyYAML",
  "openpyxl>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["drydock"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["metrics/render.py", "corpus", "runs", "deploy", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = false
ignore_missing_imports = true
exclude = ["^corpus/", "^runs/", "^deploy/", "^tests/fixtures/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: spawns a subprocess"]

[tool.coverage.run]
source = ["drydock"]
omit = ["drydock/harness/airflow_shim/*"]
